<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayank's AI Career Guider</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #6366F1, #7C3AED);
            --chat-bg: #F9FAFB;
            --primary: #6D28D9;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .welcome-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .welcome-box {
            text-align: center;
            color: white;
            max-width: 400px;
            padding: 20px;
        }

        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .header {
            padding: 18px;
            text-align: center;
            font-weight: 600;
            color: white;
            background: var(--primary);
        }

        .chat {
            flex: 1;
            background: var(--chat-bg);
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.25s ease;
        }

        .ai { background: white; align-self: flex-start; border: 1px solid #ddd; }
        .user { background: var(--primary); color: white; align-self: flex-end; }

        .input-box {
            display: flex;
            padding: 16px;
            gap: 10px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
        .input-box button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(5px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

<div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-box">
        <h1>🎯 Mayank's AI Career Guider</h1>
        <p id="welcomeSubtitle">Confused about your future? Let's figure it out together.</p>
        <button id="mainBtn" onclick="startApp()">Get Started</button>
        <div id="newMissionContainer" style="display:none; margin-top: 20px;">
            <span id="newMissionLink" style="color: white; font-size: 13px; cursor: pointer; text-decoration: underline; opacity: 0.8;">Start a new mission</span>
        </div>
    </div>
</div>

<div class="chat-container">
    <div class="header">🚀 Mayank's AI Career Guider</div>
    <div id="progress-container" style="padding: 10px 20px; background: #f3f4f6;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <p id="progress-text" style="margin: 0; font-size: 12px; color: #555; font-weight: bold;">Mission Progress: 0%</p>
            <span id="info-icon" style="cursor: pointer;">ℹ️</span>
        </div>
        <div style="width: 100%; background: #e5e7eb; border-radius: 10px; height: 10px;">
            <div id="progress-bar" style="width: 0%; height: 10px; background: #4F46E5; border-radius: 10px; transition: width 1s;"></div>
        </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="input-box">
        <input type="text" id="input" placeholder="Ask anything about your choice..." />
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    let step = 0;
    let userData = { name: "", interest: "", feeling: "", progress: 0 };

    window.onload = () => {
        const saved = localStorage.getItem("ai_career_data");
        if (saved) {
            userData = JSON.parse(saved);
            document.querySelector(".welcome-box h1").innerHTML = `🎯 Welcome Back, ${userData.name}!`;
            document.getElementById("welcomeSubtitle").textContent = `Currently at ${userData.progress}% on your ${userData.interest} path.`;
            document.getElementById("mainBtn").textContent = "Resume Mission";
            document.getElementById("newMissionContainer").style.display = "block";
            document.getElementById("newMissionLink").onclick = () => {
                if(confirm("Reset progress?")) { localStorage.clear(); location.reload(); }
            };
            step = 4;
            updateProgressBar(userData.progress);
        }
    };

    function updateProgressBar(percent) {
        document.getElementById("progress-bar").style.width = percent + "%";
        document.getElementById("progress-text").textContent = `Mission Progress: ${percent}%`;
    }

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.innerHTML = type === "ai" ? marked.parse(text) : text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function startApp() {
        document.getElementById("welcomeScreen").remove();
        if (step === 4) {
            addMessage(`**System Rebooted.** Resuming mission for **${userData.name}**. What's the update?`, "ai");
        } else {
            setTimeout(() => {
                addMessage("Hey! Let's figure this out together. Tell me your name.", "ai");
                step = 1;
            }, 300);
        }
    }

    async function send() {
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, "user");
        input.value = "";
        
        if (step === 1) { userData.name = text; addMessage(`Nice to meet you **${text}**. What career path do you want to dominate?`, "ai"); step = 2; return; }
        if (step === 2) { userData.interest = text; addMessage("Understood. How are you feeling about this path? (confused, pressured, excited)", "ai"); step = 3; return; }

        const thinking = document.createElement("div");
        thinking.className = "msg ai";
        thinking.innerHTML = "<i>Analyzing logic...</i>";
        chat.appendChild(thinking);

        try {
            const res = await fetch("/guide", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ name: userData.name, interest: userData.interest, followup: text })
            });
            const data = await res.json();
            thinking.remove();
            userData.progress = data.progress;
            updateProgressBar(data.progress);
            localStorage.setItem("ai_career_data", JSON.stringify(userData));
            addMessage(data.response, "ai");
            step = 4;
        } catch (e) {
            thinking.remove();
            addMessage("**Error:** Engine offline.", "ai");
        }
    }

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
