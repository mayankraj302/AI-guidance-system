<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayank's AI Career Guider | The 1% Filter</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #6366F1, #7C3AED);
            --chat-bg: #F9FAFB;
            --primary: #6D28D9;
            --secondary: #4F46E5;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* WELCOME SCREEN */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 0.5s ease;
        }

        .welcome-box {
            text-align: center;
            color: white;
            max-width: 420px;
            padding: 30px;
        }

        .welcome-box h1 { font-weight: 800; font-size: 2rem; margin-bottom: 10px; }
        .welcome-box p { opacity: 0.9; margin-bottom: 30px; line-height: 1.5; }

        .welcome-box button, .input-box button {
            background: white;
            color: var(--primary);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .welcome-box button:hover, .input-box button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            background: #f8f9ff;
        }

        /* CHAT INTERFACE */
        .chat-container {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            z-index: 10;
        }

        .header {
            padding: 20px;
            text-align: center;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            letter-spacing: 0.5px;
        }

        /* PROGRESS BAR POLISH */
        #progress-container {
            padding: 12px 24px;
            background: #fdfdfd;
            border-bottom: 1px solid #f0f0f0;
        }

        #info-icon {
            cursor: help;
            font-size: 16px;
            opacity: 0.5;
            transition: transform 0.2s, opacity 0.2s;
        }

        #info-icon:hover { opacity: 1; transform: scale(1.2); }

        .chat {
            flex: 1;
            background: var(--chat-bg);
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* MESSAGES */
        .msg {
            max-width: 75%;
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .ai {
            background: white;
            align-self: flex-start;
            border: 1px solid #eef0f2;
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.2);
        }

        .msg strong, .msg b {
            font-weight: 700;
            color: var(--secondary);
        }

        .input-box {
            display: flex;
            padding: 20px;
            gap: 12px;
            background: white;
            border-top: 1px solid #f0f0f0;
            
        }

        .input-box inout {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
            resize: none; 
            max-height: 150px;
            overflow-y: auto;
        }    

        .input-box input:focus { border-color: var(--primary); }

        .input-box button { background: var(--primary); color: white; padding: 0 24px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SCROLLBAR */
        .chat::-webkit-scrollbar { width: 6px; }
        .chat::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body>

<div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-box">
        <h1>🎯 The 1% Filter</h1>
        <p id="welcomeSubtitle">Stop following the crowd. Let's build a strategic roadmap for your career domination.</p>
        <button id="mainBtn" onclick="startApp()">Enter Mission</button>
        <div id="newMissionContainer" style="display:none; margin-top: 25px;">
            <span id="newMissionLink" style="color: white; font-size: 13px; cursor: pointer; text-decoration: underline; opacity: 0.7;">Start New Mission (Wipe Memory)</span>
        </div>
    </div>
</div>

<div class="chat-container">
    <div class="header">🚀 STRATEGIC GUIDANCE ENGINE</div>
    
    <div id="progress-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <p id="progress-text" style="margin: 0; font-size: 12px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Mission Progress: 0%</p>
            <span id="info-icon" title="Details">ℹ️</span>
        </div>
        <div style="width: 100%; background: #e5e7eb; border-radius: 10px; height: 8px; overflow: hidden;">
            <div id="progress-bar" style="width: 0%; height: 100%; background: var(--secondary); transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);"></div>
        </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-box">
        <input type="text" id="input" placeholder="Type your response..." autocomplete="off">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    let step = 0;
    let userData = { name: "", interest: "", progress: 0 };

    window.onload = () => {
        const saved = localStorage.getItem("ai_career_data");
        if (saved) {
            userData = JSON.parse(saved);
            document.querySelector(".welcome-box h1").innerHTML = `🎯 Welcome Back, ${userData.name}`;
            document.getElementById("welcomeSubtitle").textContent = `Currently at ${userData.progress}% on your ${userData.interest} mission.`;
            document.getElementById("mainBtn").textContent = "Resume Mission";
            document.getElementById("newMissionContainer").style.display = "block";
            document.getElementById("newMissionLink").onclick = () => {
                if(confirm("This will permanently delete your progress. Continue?")) {
                    localStorage.clear();
                    location.reload();
                }
            };
            step = 4;
            updateProgressBar(userData.progress);
        }
    };

    function updateProgressBar(percent) {
        document.getElementById("progress-bar").style.width = percent + "%";
        document.getElementById("progress-text").textContent = `Mission Progress: ${percent}%`;
    }

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.innerHTML = type === "ai" ? marked.parse(text) : text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function startApp() {
        document.getElementById("welcomeScreen").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("welcomeScreen").remove();
        }, 500);

        if (step === 4) {
            addMessage(`**System Rebooted.** Resuming mission for **${userData.name}**. What's the latest update on your ${userData.interest} progress?`, "ai");
        } else {
            setTimeout(() => {
                addMessage("Hey. I'm here to build your roadmap to the 1%. First, what's your name?", "ai");
                step = 1;
            }, 600);
        }
    }

    async function send() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        if (step === 1) {
            userData.name = text;
            addMessage(`Localized. **${text}**, what career or skill do you want to dominate?`, "ai");
            step = 2;
            return;
        }
        if (step === 2) {
            userData.interest = text;
            addMessage(`Analyzing **${text}**. How do you feel about your current progress? (e.g., lost, behind, ready to scale)`, "ai");
            step = 3;
            return;
        }

        const thinking = document.createElement("div");
        thinking.className = "msg ai";
        thinking.innerHTML = "<i>Analyzing strategy...</i>";
        chat.appendChild(thinking);
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch("/guide", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ name: userData.name, interest: userData.interest, followup: text })
            });
            const data = await res.json();
            thinking.remove();
            
            userData.progress = data.progress;
            updateProgressBar(data.progress);
            localStorage.setItem("ai_career_data", JSON.stringify(userData));
            
            addMessage(data.response, "ai");
            step = 4;
        } catch (e) {
            thinking.remove();
            addMessage("**System Offline.** Check your connection to the logic engine.", "ai");
        }
    }

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });

    document.getElementById("info-icon").onclick = () => {
        addMessage("📊 **Mission Parameters:**\n- **0-20%**: Diagnostic & Intent.\n- **20-60%**: Skill Proof & Action.\n- **60-100%**: Scaling & Market Dominance.\n\n*Progress is only granted upon proof of action.*", "ai");
    };
</script>
</body>
</html>
